<p-table [value]="data()" [tableStyle]="{ 'min-width': '50rem' }"
         [loading]="loading()" [lazy]="true"
         (onLazyLoad)="loadPageLazy($event)">
  <ng-template #header>
    <tr >
      <th width="10%">Survey Name</th>
      <th width="10%">User Email</th>
      <th width="80%">Fields Answers</th>
    </tr>
  </ng-template>
  <ng-template #body let-product>
    <tr>
      <td> {{product?.survey?.title || ''}} </td>
      <td> {{product?.user?.email || ''}}</td>
      <td>
        <div class="answers-container">
          @for (field of product?.submissionAnswers; track field.fieldId) {
            <div class="answer-row">
              <strong>{{ field.fieldLabel }}:</strong>
              <span>{{ field.answer }}</span>
            </div>
          }
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
